name: lursor
version: 0.1.0
description: >-
  Drive a local Lursor control room from Hermes — delegate work to Lursor agents
  rooted in real directories, follow autonomous goal runs, and read back the
  reply, the git diff and the files they touched.
author: Lursor
homepage: https://github.com/JonathanConn/lursor
provides_tools:
  - lursor_workspaces
  - lursor_agents
  - lursor_threads
  - lursor_messages
  - lursor_delegate
  - lursor_run_status
  - lursor_stop_run
  - lursor_diff
  - lursor_list_files
  - lursor_read_file
provides_hooks:
  - pre_llm_call
# LURSOR_API_BASE is deliberately NOT declared under requires_env: the default
# (http://127.0.0.1:8791/api) is right for every normal install, and gating the
# plugin on an env var would prompt users for something they don't need to set.
