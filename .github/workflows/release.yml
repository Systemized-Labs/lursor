name: release

# Build the desktop app (renderer + frozen backend) for macOS (arm64) and Linux
# (x64), sign + notarize the macOS build, and attach the artifacts to a GitHub
# Release.
#
# Triggered by a push to main that moves frontend/package.json's version: the
# version bump landing on main *is* the release trigger, and the tag is created
# by the `publish` job at that commit. Pushing a v* tag by hand still works and
# takes the same path. See the `gate` job.
#
# Intel macOS is deliberately not built: Apple has dropped x86_64, GitHub retires
# its last Intel runner in Aug 2027, and Homebrew demotes Intel to tier 3 in
# Sept 2026. The frozen backend is arch-specific, so supporting it would mean a
# second full build + notarization for a shrinking audience.
#
# macOS signing is opt-in on the secrets being present: with none configured the
# build still succeeds, just unsigned (electron-builder skips both signing and
# notarization). Secrets required for a signed build:
#   APPLE_CERT_P12        base64 of the Developer ID Application .p12
#   APPLE_CERT_PASSWORD   password used when exporting that .p12
#   APPLE_API_KEY_P8      base64 of the App Store Connect API key (.p8)
#   APPLE_API_KEY_ID      key ID for that .p8
#   APPLE_API_ISSUER      issuer ID for that .p8
#   APPLE_TEAM_ID         10-character Developer Team ID
# Optional, for the Homebrew tap bump:
#   HOMEBREW_TAP_TOKEN    PAT with contents:write on JonathanConn/homebrew-lursor

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# One release pipeline per ref. Two pushes to main in quick succession would
# otherwise race for the same tag, and the loser publishes assets built from the
# wrong commit. Not cancel-in-progress: a run that has reached `publish` must
# finish, or the release is left half-uploaded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this run releases anything, and under what tag. Everything
  # downstream reads the tag and version from here rather than from the ref, so
  # the branch-push and tag-push paths are otherwise identical.
  #
  # A push to main releases when frontend/package.json names a version with no
  # tag yet — bumping the version in a merged PR is the entire trigger. Pushes
  # that leave the version alone resolve to an existing tag and stop here, so an
  # ordinary merge costs one cheap job and nothing else.
  #
  # The tag is created by `publish`, at the released commit, rather than pushed
  # from here. That is not a stylistic choice: a tag pushed with GITHUB_TOKEN
  # does not start a new workflow run, so a job that tagged main would leave the
  # tag-triggered pipeline permanently unfired. Tagging from the job that
  # already has the artifacts also means a tag never exists for a build that
  # failed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # Four files carry the version and all four have to agree. They drifted once
      # already: app/__init__.py and the FastAPI `version=` sat at 0.1.0 from v0.1.0
      # until this check existed, because the release checklist only named three of
      # them and nothing verified it. The API reported the wrong version for six
      # releases.
      #
      # Here in `gate` rather than in a build job: it costs a second and fails before
      # a ~300MB notarized build, not after. The uv.lock arm matters most —
      # build_bundle.sh runs `uv export --frozen`, which does *not* verify lock
      # freshness (that is `--locked`), so a drifted lock is otherwise tolerated
      # silently and ships in the bundle.
      - name: Check every version is in lockstep
        run: |
          PKG="$(node -p "require('./frontend/package.json').version")"
          PYPROJECT="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -1)"
          INIT="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/__init__.py | head -1)"
          LOCK="$(awk -F'"' '/^name = "lursor-backend"$/{f=1;next} f && /^version = /{print $2; exit}' backend/uv.lock)"

          echo "frontend/package.json      $PKG"
          echo "backend/pyproject.toml     $PYPROJECT"
          echo "backend/app/__init__.py    $INIT"
          echo "backend/uv.lock            $LOCK"

          fail=0
          for pair in "pyproject.toml:$PYPROJECT" "app/__init__.py:$INIT" "uv.lock:$LOCK"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "error: could not read a version from $name" >&2
              fail=1
            elif [ "$value" != "$PKG" ]; then
              echo "error: $name is $value but frontend/package.json is $PKG" >&2
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump all four together — see docs/DISTRIBUTION.md." >&2
            exit 1
          fi
          echo "all four agree on $PKG"

      - name: Resolve the version to release
        id: decide
        run: |
          PKG_VERSION="$(node -p "require('./frontend/package.json').version")"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # frontend/package.json's version — not the tag — names every
            # artifact, so a mismatch produces a release full of wrongly-versioned
            # files and fails the Homebrew bump only after a full build has
            # already run. Fail in seconds instead.
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "error: tag $GITHUB_REF_NAME implies $TAG_VERSION, but frontend/package.json is $PKG_VERSION" >&2
              echo "Bump the version and re-tag." >&2
              exit 1
            fi
            TAG="$GITHUB_REF_NAME"
            BUILD=true
          else
            TAG="v$PKG_VERSION"
            # An existing tag means this push did not bump the version, so there
            # is nothing to release. Also what makes a re-push of an already
            # released commit a no-op instead of a second release.
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "$TAG already exists — no version bump on this push, nothing to release"
              BUILD=false
            else
              echo "no tag for $PKG_VERSION yet — releasing $TAG from $GITHUB_SHA"
              BUILD=true
            fi
          fi

          # Dispatch runs build (useful for checking a pipeline change without
          # burning a version number) but never publish.
          if [ "$BUILD" = true ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          {
            echo "version=$PKG_VERSION"
            echo "tag=$TAG"
            echo "build=$BUILD"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The frozen backend is arch-specific, so each arch builds on a
          # matching runner rather than cross-building.
          - os: macos-15 # Apple Silicon
            arch: arm64
            builder_flags: --mac
          - os: ubuntu-latest
            arch: x64
            builder_flags: --linux

    runs-on: ${{ matrix.os }}

    # Secrets can't be read from a step-level `if`, so map them into the job env
    # and test those. electron-builder reads APPLE_* / CSC_* straight from here.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # Import the Developer ID cert into a throwaway keychain. Both
      # electron-builder and our afterPack hook sign out of it, via CSC_KEYCHAIN
      # + CSC_NAME, so the app and the bundled Python tree get the same identity.
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/lursor-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for keychain access and hangs in CI.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Keep the default keychains in the search list so system roots resolve.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "error: no Developer ID Application identity in the imported cert" >&2
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CSC_NAME=$IDENTITY" >> "$GITHUB_ENV"

      # notarytool wants a path to the .p8, not its contents.
      - name: Stage App Store Connect API key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8 != ''
        run: |
          KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build frozen backend bundle
        run: bash backend/scripts/build_bundle.sh backend/bundle

      - name: Install frontend deps
        working-directory: frontend
        run: bun install

      - name: Build renderer
        working-directory: frontend
        run: bun run build

      # Slow step: ~85 nested Mach-O files in the Python bundle get signed
      # (afterPack), then a ~400 MB disk image goes through Apple's notary.
      #
      # Always `--publish never`: this job builds files and nothing else. The
      # release is assembled by the single `publish` job below. Letting each
      # matrix job publish is what produced three duplicate draft releases for
      # v0.1.0 — electron-builder creates the release lazily per upload, and
      # concurrent uploads (even within one job) each created their own.
      - name: Package desktop app
        working-directory: frontend
        run: npx electron-builder ${{ matrix.builder_flags }} --publish never

      # latest*.yml are the electron-updater feeds and *.blockmap backs
      # differential updates; both must reach the release or auto-update
      # silently breaks. Match latest*.yml rather than *.yml: electron-builder
      # also drops a builder-debug.yml of its internal config, which is the
      # same filename on every platform — it would collide under the publish
      # job's merge-multiple and get uploaded as a public release asset.
      # if-no-files-found: error so a build that produced nothing fails here
      # rather than yielding an incomplete release later.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lursor-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/latest*.yml
            frontend/release/*.blockmap
          if-no-files-found: error

  # The single writer to the GitHub Release.
  #
  # Every artifact is built before anything is published, so a release is either
  # complete or absent — a platform failing means no release at all, rather than
  # a half-populated one that looks installable. This job is also the only
  # process that touches the release, which is what makes duplicate drafts
  # structurally impossible rather than merely unlikely.
  #
  # Also the job that creates the tag, for a release triggered by a push to main
  # — see `gate`. It is the last thing to happen, so a tag existing means a
  # complete release exists at it.
  #
  # Gated on `gate.outputs.publish`, which is gated on the *event*, not just the
  # ref: a workflow_dispatch can select a tag, in which case github.ref is
  # refs/tags/v* too. A ref-only guard let a manual re-run of an already-released
  # tag create a second release for it, which is exactly what produced the
  # duplicate v0.1.4 drafts.
  publish:
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Fail before creating anything if the asset set is not what a release is
      # supposed to contain. Without this the pipeline will happily publish a
      # release missing a platform, an update feed, or the DMG itself.
      - name: Verify the asset set is complete
        run: |
          cd artifacts
          ls -la
          missing=0
          for f in \
            "Lursor-${VERSION}-mac-arm64.dmg" \
            "Lursor-${VERSION}-mac-arm64.zip" \
            "Lursor-${VERSION}-linux-x86_64.AppImage" \
            "Lursor-${VERSION}-linux-amd64.deb" \
            "latest-mac.yml" \
            "latest-linux.yml" \
          ; do
            if [ ! -f "$f" ]; then
              echo "error: missing expected release asset: $f" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "refusing to publish an incomplete release" >&2
            exit 1
          }
          echo "all expected assets present"

      # One checksum file over the complete set. The per-platform split this
      # replaces existed only because two concurrent jobs could not share a
      # file; scripts/install.sh looks its own asset up by name within this.
      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          rm -f SHA256SUMS.txt
          for f in *.dmg *.zip *.AppImage *.deb; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      # Published outright rather than as a draft. Drafting was meant to allow a
      # human check, but a draft is invisible to every install path — the
      # /releases/latest API (scripts/install.sh), the release page, and
      # electron-updater all skip drafts — so a forgotten manual
      # `gh release edit --draft=false` silently strands users on the previous
      # version. That is what left v0.1.3 and v0.1.4 unreleased. The asset check
      # above is the gate now; it is enforced on every run, which a human step is
      # not. Bump the version only when you intend to ship.
      #
      # --latest explicitly: GitHub does not re-evaluate "latest" when a release
      # is flipped out of draft, so v0.1.4 stayed non-latest even after being
      # published until make_latest was set by hand. Stating it removes that
      # dependence on creation order.
      #
      # Idempotent, so re-running a failed publish job repairs the release rather
      # than dying on "already exists".
      #
      # --target pins the release to this run's commit, and creates the tag there
      # if it does not exist yet — which is how a push to main gets tagged. For a
      # tag push the tag already exists and --target is ignored, so both paths run
      # the same command.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists — re-uploading assets and publishing"
            gh release upload "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              --latest \
              artifacts/*
          fi

  # Point the Homebrew tap at the new version. Runs only for published releases
  # and only when a tap token is configured; the tap repo itself is
  # JonathanConn/homebrew-lursor (see docs/DISTRIBUTION.md).
  homebrew:
    needs: [gate, publish]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump the cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="Lursor-${VERSION}-mac-arm64.dmg"

          # Reuse the checksum the publish job generated rather than
          # re-downloading a 400 MB image just to hash it.
          gh release download "$TAG" \
            --pattern "SHA256SUMS.txt" --output sums.txt
          SHA="$(awk -v a="$ASSET" '$2 == a || $2 == "*" a {print $1}' sums.txt | head -n 1)"
          if [ -z "$SHA" ]; then
            echo "error: no checksum for $ASSET in the release" >&2
            exit 1
          fi

          sed -e "s/@@VERSION@@/$VERSION/" -e "s/@@SHA256@@/$SHA/" \
            packaging/homebrew/lursor.rb.template > lursor.rb

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/JonathanConn/homebrew-lursor.git" tap
          mkdir -p tap/Casks
          mv lursor.rb tap/Casks/lursor.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lursor.rb
          # --cached, so this also catches the first-ever (untracked) cask.
          if git diff --cached --quiet -- Casks/lursor.rb; then
            echo "cask already at $VERSION — nothing to push"
            exit 0
          fi
          git commit -m "lursor $VERSION"
          # -u HEAD works whether or not the tap already has a default branch.
          git push -u origin HEAD
