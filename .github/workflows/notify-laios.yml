name: Notify laios of new commit

# On every push to lursor main, poke the laios repo so it bumps the
# products/lursor submodule pin (see .github/workflows/bump-lursor.yml there).
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch lursor-updated to laios
        env:
          # Fine-grained PAT with "Contents: read and write" on cgrohman/laios,
          # stored as a secret in this (lursor) repo.
          LAIOS_DISPATCH_TOKEN: ${{ secrets.LAIOS_DISPATCH_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${LAIOS_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cgrohman/laios/dispatches \
            -d "{\"event_type\":\"lursor-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}"
