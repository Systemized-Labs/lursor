[project]
name = "lursor-backend"
version = "0.1.8"
description = "Lursor agent-harness backend (FastAPI + pydantic-deepagents)"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.52",
    "sqlmodel>=0.0.39",
    "aiosqlite>=0.22",
    "greenlet>=3.5",
    "pydantic-settings>=2.14",
    "pydantic-ai>=2.20",
    "ag-ui-protocol>=0.1.19",
    # Pinned to a commit: an unpinned git dependency makes releases
    # unreproducible and lets an upstream push change what we ship.
    "pydantic-deep[browser] @ git+https://github.com/vstorm-co/pydantic-deepagents.git@04c802b673ec8468407a9887a053d97e6ea17bb4",
    "pydantic-ai-slim[duckduckgo,exa,tavily]>=2.20.0",
    "croniter>=6.2.4",
]

[project.scripts]
# Installs the backend as a supervised service (see app/service.py). A console
# script rather than a bare module so the documented command is short enough to
# paste, and so `uv run lursor-service` resolves the right interpreter — which is
# what the generated unit is derived from.
lursor-service = "app.service:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Bring-your-own memory layer: the Hindsight memory provider (see
# ``app/agents/hindsight.py``). Optional because it pulls an aiohttp transport
# this backend does not otherwise use, and because the default "file" provider
# (pydantic-deep's MEMORY.md) needs nothing. Install with
# ``uv sync --extra dev --extra hindsight``; without it the provider degrades to
# file memory with a logged warning and a UI-visible notice.
hindsight = ["hindsight-pydantic-ai>=0.4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() in argument defaults is the idiomatic pattern.
ignore = ["B008"]
