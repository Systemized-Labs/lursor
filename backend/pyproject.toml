[project]
name = "hearthstack-backend"
version = "0.1.0"
description = "Hearthstack agent-harness backend (FastAPI + pydantic-deepagents)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic-settings>=2.5",
    "pydantic-ai>=0.0.20",
    "ag-ui-protocol>=0.1.7",
    "pydantic-deep @ git+https://github.com/vstorm-co/pydantic-deepagents.git",
    "pydantic-ai-slim[duckduckgo]>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() in argument defaults is the idiomatic pattern.
ignore = ["B008"]
