[project]
name = "lursor-backend"
version = "0.1.0"
description = "Lursor agent-harness backend (FastAPI + pydantic-deepagents)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic-settings>=2.5",
    "pydantic-ai>=0.0.20",
    "ag-ui-protocol>=0.1.7",
    # Pinned to a commit: an unpinned git dependency makes releases
    # unreproducible and lets an upstream push change what we ship.
    "pydantic-deep[browser] @ git+https://github.com/vstorm-co/pydantic-deepagents.git@8b91848525f361b159fdd4c782c2f21a6f1b9871",
    "pydantic-ai-slim[duckduckgo,exa,tavily]>=2.8.0",
    "croniter>=6.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Bring-your-own memory layer: the Hindsight memory provider (see
# ``app/agents/hindsight.py``). Optional because it pulls an aiohttp transport
# this backend does not otherwise use, and because the default "file" provider
# (pydantic-deep's MEMORY.md) needs nothing. Install with
# ``uv sync --extra dev --extra hindsight``; without it the provider degrades to
# file memory with a logged warning and a UI-visible notice.
hindsight = ["hindsight-pydantic-ai>=0.4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() in argument defaults is the idiomatic pattern.
ignore = ["B008"]
